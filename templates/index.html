<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BibManager</title>
<style>
  /* ── Design tokens ── */
  :root {
    --bg:        #0f1117;
    --bg2:       #181c27;
    --bg3:       #1e2335;
    --border:    #2a3050;
    --accent:    #4f8ef7;
    --accent2:   #7c5cbf;
    --green:     #3ecf7a;
    --yellow:    #f5c842;
    --red:       #e05c5c;
    --text:      #e2e6f0;
    --muted:     #8892ab;
    --radius:    8px;
    --font-mono: 'JetBrains Mono', 'Fira Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', 'Hiragino Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: grid;
    grid-template-rows: 52px 1fr;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
  }
  .logo {
    font-weight: 700;
    font-size: 15px;
    color: var(--accent);
    letter-spacing: .04em;
    white-space: nowrap;
  }
  .search-wrap {
    flex: 1;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
  }
  #search {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 14px;
    padding: 7px 12px 7px 34px;
    outline: none;
    transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }

  .header-actions { display: flex; gap: 8px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 13px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--border); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #3a7de8; }
  .btn-danger  { color: var(--red); }
  .btn-danger:hover { border-color: var(--red); }
  .btn-notion { background: var(--bg3); border-color: #555; color: var(--text); }
  .btn-notion:hover { border-color: var(--accent2); }

  /* ── Main layout ── */
  .main {
    display: grid;
    grid-template-columns: 220px 1fr;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  aside {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-section {
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 2px 0;
  }
  .stat-val { color: var(--accent); font-weight: 700; }

  /* Year filter */
  .year-inputs { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .year-inputs input {
    width: 64px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-size: 12px;
    padding: 5px 7px;
    outline: none;
  }
  .year-inputs input:focus { border-color: var(--accent); }

  /* Tags / Keywords sidebar list */
  .filter-list {
    overflow-y: auto;
    padding: 6px;
    flex-shrink: 0;
    max-height: 220px;
  }
  .filter-list.kw-list {
    border-top: 1px solid var(--border);
    flex: 1;
  }
  .tag-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: background .12s;
  }
  .tag-item:hover { background: var(--bg3); }
  .tag-item.active { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .tag-item.active-kw { background: color-mix(in srgb, var(--green) 18%, transparent); }
  .tag-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent2);
    flex-shrink: 0;
  }
  .kw-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }
  .tag-name { flex: 1; }
  .tag-count {
    font-size: 11px;
    color: var(--muted);
    background: var(--bg3);
    border-radius: 10px;
    padding: 1px 6px;
  }

  /* ── Entry list ── */
  .list-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .list-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  .list-toolbar .count { margin-left: auto; }
  .entry-list {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }

  /* ── Table view ── */
  .entry-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .entry-table thead {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg3);
  }
  .entry-table th {
    padding: 8px 12px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  .entry-table th:hover { color: var(--text); }
  .entry-table th .sort-arrow { margin-left: 3px; opacity: .5; }
  .entry-table th.sorted .sort-arrow { opacity: 1; color: var(--accent); }

  .entry-table tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .1s;
  }
  .entry-table tbody tr:hover { background: var(--bg3); }
  .entry-table tbody tr.active {
    background: color-mix(in srgb, var(--accent) 10%, var(--bg2));
  }
  .entry-table td {
    padding: 7px 12px;
    vertical-align: middle;
    line-height: 1.4;
  }
  .td-year {
    width: 52px;
    color: var(--yellow);
    font-weight: 700;
    white-space: nowrap;
  }
  .td-type {
    width: 70px;
  }
  .type-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--bg3);
    color: var(--muted);
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .td-title {
    min-width: 200px;
    max-width: 340px;
  }
  .td-title-text {
    font-weight: 600;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .td-authors {
    width: 180px;
    max-width: 180px;
    color: var(--muted);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .td-tags {
    min-width: 100px;
  }
  .td-tags-wrap { display: flex; flex-wrap: wrap; gap: 3px; }
  .tag-badge {
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--accent2) 20%, transparent);
    color: color-mix(in srgb, var(--accent2) 80%, var(--text));
    border: 1px solid color-mix(in srgb, var(--accent2) 40%, transparent);
    white-space: nowrap;
  }
  .arxiv-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--red) 15%, transparent);
    color: #e08080;
    border: 1px solid color-mix(in srgb, var(--red) 30%, transparent);
    white-space: nowrap;
  }

  /* ── Detail panel ── */
  .detail-panel {
    position: fixed;
    top: 52px;
    right: 0;
    bottom: 0;
    width: 480px;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform .22s ease;
    z-index: 100;
  }
  .detail-panel.open { transform: none; }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .detail-header h2 {
    font-size: 15px;
    font-weight: 700;
    flex: 1;
    min-width: 0;
  }
  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .detail-section { margin-bottom: 20px; }
  .detail-section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .detail-meta { font-size: 13px; line-height: 1.8; }
  .detail-meta a { color: var(--accent); text-decoration: none; }
  .detail-meta a:hover { text-decoration: underline; }
  .meta-label { color: var(--muted); }

  /* Tag editor */
  .tag-editor {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 40px;
    cursor: text;
  }
  .tag-editor .tag-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: color-mix(in srgb, var(--accent2) 25%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent2) 50%, transparent);
    border-radius: 12px;
    font-size: 12px;
    padding: 2px 8px 2px 10px;
  }
  .tag-chip button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
  }
  .tag-chip button:hover { color: var(--red); }
  .tag-input {
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    min-width: 80px;
    flex: 1;
  }
  .autocomplete {
    position: absolute;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 200;
    max-height: 180px;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .autocomplete-item {
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .autocomplete-item:hover,
  .autocomplete-item.hl { background: var(--border); }

  /* Keyword editor (global list, same UX as tags) */
  .kw-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 40px;
    cursor: text;
  }
  .kw-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: color-mix(in srgb, var(--green) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--green) 35%, transparent);
    border-radius: 12px;
    font-size: 12px;
    padding: 2px 8px 2px 10px;
    color: color-mix(in srgb, var(--green) 80%, var(--text));
  }
  .kw-chip button {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 14px; line-height: 1; padding: 0;
  }
  .kw-chip button:hover { color: var(--red); }
  .kw-input {
    border: none; outline: none; background: transparent;
    color: var(--text); font-size: 13px; min-width: 80px; flex: 1;
  }

  /* Textarea */
  textarea.note-area {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    padding: 10px 12px;
    resize: vertical;
    min-height: 100px;
    outline: none;
    transition: border-color .15s;
  }
  textarea.note-area:focus { border-color: var(--accent); }

  /* Citation cards */
  .citation-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .citation-source {
    font-size: 11px;
    color: var(--yellow);
    margin-bottom: 4px;
    font-style: italic;
  }
  .citation-actions { display: flex; gap: 6px; margin-top: 6px; }

  /* BibTeX block */
  .bibtex-block {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    font-size: 12px;
    font-family: var(--font-mono);
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.6;
    color: #a8c4e8;
    max-height: 280px;
    overflow-y: auto;
    position: relative;
  }
  .copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
  }

  /* Abstract */
  .abstract-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
    background: var(--bg3);
    border-radius: var(--radius);
    padding: 10px 12px;
    max-height: 160px;
    overflow-y: auto;
  }

  /* Inline editable inputs */
  .inline-input {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-size: 13px;
    padding: 5px 8px;
    outline: none;
    width: 100%;
  }
  .inline-input:focus { border-color: var(--accent); }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 18px;
    font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    z-index: 9999;
  }
  #toast.show { opacity: 1; transform: none; }
  #toast.ok   { border-color: var(--green); color: var(--green); }
  #toast.err  { border-color: var(--red);   color: var(--red); }

  /* Loading */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 440px;
    max-width: 95vw;
  }
  .modal h3 { font-size: 16px; margin-bottom: 16px; }
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    margin-bottom: 14px;
  }
  .drop-zone:hover, .drop-zone.over {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 5%, transparent);
  }
  .import-result {
    background: var(--bg3);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }
  .notion-errors {
    margin-top: 8px;
    max-height: 120px;
    overflow-y: auto;
    font-size: 11px;
    color: var(--muted);
    font-family: var(--font-mono);
  }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <span class="logo">📚 BibManager</span>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search" type="text" placeholder="タイトル・著者・キーワード・メモを検索…（/ でフォーカス）">
  </div>
  <div class="header-actions">
    <button class="btn" id="btn-import">⬆ Import .bib</button>
    <button class="btn btn-notion" id="btn-notion">📥 Notion CSV</button>
    <button class="btn" id="btn-export">⬇ Export .bib</button>
  </div>
</header>

<!-- ── MAIN ── -->
<div class="main">

  <!-- Sidebar -->
  <aside>
    <div class="sidebar-section">
      <div class="sidebar-label">統計</div>
      <div class="stat-row"><span>総文献数</span><span class="stat-val" id="stat-total">–</span></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">年フィルタ</div>
      <div class="year-inputs">
        <input type="number" id="year-from" placeholder="1900" min="1900" max="2100">
        <span>–</span>
        <input type="number" id="year-to" placeholder="2099" min="1900" max="2100">
      </div>
    </div>

    <div class="sidebar-section" style="border-bottom:none; padding-bottom:4px;">
      <div class="sidebar-label">
        <span>タグ</span>
        <span id="tag-clear" style="cursor:pointer;color:var(--muted);font-size:10px;display:none;" onclick="clearTagFilter()">クリア</span>
      </div>
    </div>
    <div class="filter-list" id="tags-list">
      <div style="color:var(--muted);font-size:12px;padding:8px;">読み込み中…</div>
    </div>

    <div class="sidebar-section" style="border-top:1px solid var(--border); border-bottom:none; padding-bottom:4px;">
      <div class="sidebar-label">
        <span>キーワード</span>
        <span id="kw-clear" style="cursor:pointer;color:var(--muted);font-size:10px;display:none;" onclick="clearKwFilter()">クリア</span>
      </div>
    </div>
    <div class="filter-list kw-list" id="keywords-list">
      <div style="color:var(--muted);font-size:12px;padding:8px;">読み込み中…</div>
    </div>
  </aside>

  <!-- Entry list -->
  <div class="list-panel" id="list-panel">
    <div class="list-toolbar">
      <span id="list-status">読み込み中…</span>
      <span class="count" id="list-count"></span>
    </div>
    <div class="entry-list" id="entry-list"></div>
  </div>

</div>

<!-- ── DETAIL PANEL ── -->
<div class="detail-panel" id="detail-panel">
  <div class="detail-header">
    <button class="btn" id="detail-close" onclick="closeDetail()">✕</button>
    <h2 id="detail-heading">文献詳細</h2>
  </div>
  <div class="detail-body" id="detail-body">
    <!-- Filled dynamically -->
  </div>
</div>

<!-- ── IMPORT .bib MODAL ── -->
<div class="modal-overlay" id="import-modal">
  <div class="modal">
    <h3>📂 .bib ファイルをインポート</h3>
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('bib-file-input').click()">
      クリックまたはドラッグ＆ドロップ<br>
      <small style="font-size:11px;margin-top:4px;display:block;">既存のメモ・タグは保持されます</small>
    </div>
    <input type="file" id="bib-file-input" accept=".bib" style="display:none">
    <div class="import-result" id="import-result"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
      <button class="btn" onclick="closeImportModal()">閉じる</button>
    </div>
  </div>
</div>

<!-- ── NOTION IMPORT MODAL ── -->
<div class="modal-overlay" id="notion-modal">
  <div class="modal">
    <h3>📥 Notion CSV インポート</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">
      Notionからエクスポートした CSV ファイルを選択してください。<br>
      タグ・キーワード・メモを既存の文献にマージします。
    </p>
    <div class="drop-zone" id="notion-drop-zone" onclick="document.getElementById('notion-file-input').click()">
      クリックまたはドラッグ＆ドロップ<br>
      <small style="font-size:11px;margin-top:4px;display:block;">既存データは上書きせず追記されます</small>
    </div>
    <input type="file" id="notion-file-input" accept=".csv" style="display:none">
    <div class="import-result" id="notion-result"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
      <button class="btn" onclick="closeNotionModal()">閉じる</button>
    </div>
  </div>
</div>

<!-- ── TOAST ── -->
<div id="toast"></div>

<script>
// =====================================================================
// State
// =====================================================================
let state = {
  query: '',
  tags: [],        // active tag IDs (AND)
  kws:  [],        // active keyword IDs (AND)
  yearFrom: null,
  yearTo: null,
  offset: 0,
  limit: 2000,     // load all at once
  total: 0,
  allTags: [],     // [{id, name, count}]
  allKeywords: [], // [{id, name, count}]
  currentEntryId: null,
  debounceTimer: null,
  sortCol: 'year',
  sortDir: -1,     // -1 = desc, 1 = asc
};

// =====================================================================
// Init
// =====================================================================
document.addEventListener('DOMContentLoaded', async () => {
  await Promise.all([loadTags(), loadKeywords(), loadStats()]);
  await loadEntries();
  bindEvents();
});

function bindEvents() {
  // Search
  document.getElementById('search').addEventListener('input', e => {
    clearTimeout(state.debounceTimer);
    state.debounceTimer = setTimeout(() => {
      state.query = e.target.value.trim();
      state.offset = 0;
      loadEntries();
    }, 280);
  });

  // Year filters
  ['year-from', 'year-to'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      state.yearFrom = parseInt(document.getElementById('year-from').value) || null;
      state.yearTo   = parseInt(document.getElementById('year-to').value)   || null;
      state.offset = 0;
      loadEntries();
    });
  });

  // Keyboard shortcut
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault();
      document.getElementById('search').focus();
    }
    if (e.key === 'Escape') closeDetail();
  });

  // Import / Export
  document.getElementById('btn-import').onclick = () => openImportModal();
  document.getElementById('btn-export').onclick = () => { window.location = '/api/export'; };
  document.getElementById('btn-notion').onclick = () => openNotionModal();

  // .bib Drop zone
  const dz = document.getElementById('drop-zone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f) importBibFile(f);
  });
  document.getElementById('bib-file-input').addEventListener('change', e => {
    if (e.target.files[0]) importBibFile(e.target.files[0]);
  });

  // Notion CSV Drop zone
  const ndz = document.getElementById('notion-drop-zone');
  ndz.addEventListener('dragover', e => { e.preventDefault(); ndz.classList.add('over'); });
  ndz.addEventListener('dragleave', () => ndz.classList.remove('over'));
  ndz.addEventListener('drop', e => {
    e.preventDefault();
    ndz.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f) importNotionFile(f);
  });
  document.getElementById('notion-file-input').addEventListener('change', e => {
    if (e.target.files[0]) importNotionFile(e.target.files[0]);
  });
}

// =====================================================================
// API helpers
// =====================================================================
async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// =====================================================================
// Load & render tags
// =====================================================================
async function loadTags() {
  const tags = await api('/api/tags');
  state.allTags = tags;
  renderTags();
}

function renderTags() {
  const el = document.getElementById('tags-list');
  if (!state.allTags.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:8px;">タグなし</div>';
    return;
  }
  el.innerHTML = state.allTags.map(t => `
    <div class="tag-item ${state.tags.includes(t.id) ? 'active' : ''}"
         onclick="toggleTag(${t.id})">
      <div class="tag-dot"></div>
      <span class="tag-name">${esc(t.name)}</span>
      <span class="tag-count">${t.count}</span>
    </div>
  `).join('');
  document.getElementById('tag-clear').style.display = state.tags.length ? '' : 'none';
}

function toggleTag(id) {
  const idx = state.tags.indexOf(id);
  if (idx === -1) state.tags.push(id);
  else state.tags.splice(idx, 1);
  state.offset = 0;
  renderTags();
  loadEntries();
}

function clearTagFilter() {
  state.tags = [];
  state.offset = 0;
  renderTags();
  loadEntries();
}

// =====================================================================
// Load & render keywords
// =====================================================================
async function loadKeywords() {
  const kws = await api('/api/keywords');
  state.allKeywords = kws;
  renderKeywords();
}

function renderKeywords() {
  const el = document.getElementById('keywords-list');
  if (!state.allKeywords.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:8px;">キーワードなし</div>';
    return;
  }
  el.innerHTML = state.allKeywords.map(k => `
    <div class="tag-item ${state.kws.includes(k.id) ? 'active-kw' : ''}"
         onclick="toggleKw(${k.id})">
      <div class="kw-dot"></div>
      <span class="tag-name">${esc(k.name)}</span>
      <span class="tag-count">${k.count}</span>
    </div>
  `).join('');
  document.getElementById('kw-clear').style.display = state.kws.length ? '' : 'none';
}

function toggleKw(id) {
  const idx = state.kws.indexOf(id);
  if (idx === -1) state.kws.push(id);
  else state.kws.splice(idx, 1);
  state.offset = 0;
  renderKeywords();
  loadEntries();
}

function clearKwFilter() {
  state.kws = [];
  state.offset = 0;
  renderKeywords();
  loadEntries();
}

// =====================================================================
// Load & render stats
// =====================================================================
async function loadStats() {
  const s = await api('/api/stats');
  document.getElementById('stat-total').textContent = s.total.toLocaleString();
}

// =====================================================================
// Load & render entries
// =====================================================================
// Cached entry rows for client-side sort
let _cachedEntries = [];

async function loadEntries() {
  const params = new URLSearchParams({
    q:      state.query,
    limit:  state.limit,
    offset: 0,
  });
  if (state.yearFrom) params.append('year_from', state.yearFrom);
  if (state.yearTo)   params.append('year_to',   state.yearTo);
  state.tags.forEach(tid => params.append('tag', tid));
  state.kws.forEach(kid  => params.append('kw',  kid));

  document.getElementById('list-status').innerHTML = '<span class="spinner"></span>';

  const data = await api('/api/entries?' + params.toString());
  state.total = data.total;
  _cachedEntries = data.entries;

  renderTable();
}

function renderTable() {
  const el = document.getElementById('entry-list');

  if (!_cachedEntries.length) {
    el.innerHTML = `<div style="text-align:center;padding:48px 0;color:var(--muted);">
      <div style="font-size:32px;margin-bottom:8px;">🔍</div>
      <div>文献が見つかりません</div>
    </div>`;
    document.getElementById('list-status').textContent = '0件';
    document.getElementById('list-count').textContent = '';
    return;
  }

  // Client-side sort
  const sorted = [..._cachedEntries].sort((a, b) => {
    let va = a[state.sortCol] ?? '';
    let vb = b[state.sortCol] ?? '';
    if (state.sortCol === 'year') { va = va || 0; vb = vb || 0; }
    if (va < vb) return -state.sortDir;
    if (va > vb) return  state.sortDir;
    return 0;
  });

  const cols = [
    { key: 'year',       label: '年',     cls: 'td-year' },
    { key: 'entry_type', label: '種別',   cls: 'td-type' },
    { key: 'title',      label: 'タイトル', cls: 'td-title' },
    { key: 'author',     label: '著者',   cls: 'td-authors' },
    { key: 'tags',       label: 'タグ',   cls: 'td-tags', noSort: true },
  ];

  const thead = cols.map(c => {
    const isSorted = state.sortCol === c.key;
    const arrow = c.noSort ? '' : `<span class="sort-arrow">${isSorted ? (state.sortDir === 1 ? '▲' : '▼') : '▲'}</span>`;
    const onclick = c.noSort ? '' : `onclick="sortBy('${c.key}')"`;
    return `<th class="${isSorted ? 'sorted' : ''}" ${onclick}>${c.label}${arrow}</th>`;
  }).join('');

  const tbody = sorted.map(e => {
    const authors = formatAuthors(e.author);
    const tags    = (e.tags || []).map(t => `<span class="tag-badge">${esc(t.name)}</span>`).join('');
    const arxiv   = e.eprint ? `<span class="arxiv-badge">arXiv</span>` : '';
    const typeBadge = `<span class="type-badge">${esc(e.entry_type)}</span>`;

    return `<tr onclick="openDetail(${e.id})" id="ec-${e.id}"
                class="${state.currentEntryId === e.id ? 'active' : ''}">
      <td class="td-year">${e.year || '?'}</td>
      <td class="td-type">${typeBadge} ${arxiv}</td>
      <td class="td-title"><div class="td-title-text">${esc(e.title || '(タイトルなし)')}</div></td>
      <td class="td-authors">${esc(authors)}</td>
      <td class="td-tags"><div class="td-tags-wrap">${tags}</div></td>
    </tr>`;
  }).join('');

  el.innerHTML = `<table class="entry-table">
    <thead><tr>${thead}</tr></thead>
    <tbody>${tbody}</tbody>
  </table>`;

  document.getElementById('list-status').textContent = `${state.total.toLocaleString()} 件`;
  document.getElementById('list-count').textContent =
    state.total > _cachedEntries.length ? `（${_cachedEntries.length}件表示）` : '';
}

function sortBy(col) {
  if (state.sortCol === col) {
    state.sortDir *= -1;
  } else {
    state.sortCol = col;
    state.sortDir = col === 'year' ? -1 : 1;
  }
  renderTable();
}

function formatAuthors(authorStr) {
  if (!authorStr) return '著者不明';
  const parts = authorStr.split(' | ');
  if (parts.length <= 2) return parts.join(', ');
  return parts[0] + ' et al.';
}

// =====================================================================
// Detail panel
// =====================================================================
async function openDetail(entryId) {
  state.currentEntryId = entryId;
  document.querySelectorAll('#entry-list tr').forEach(c => c.classList.remove('active'));
  const card = document.getElementById(`ec-${entryId}`);
  if (card) card.classList.add('active');

  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('detail-body').innerHTML =
    '<div style="display:flex;justify-content:center;padding:40px;"><span class="spinner"></span></div>';

  const entry = await api(`/api/entries/${entryId}`);
  renderDetail(entry);
}

function closeDetail() {
  state.currentEntryId = null;
  document.getElementById('detail-panel').classList.remove('open');
  document.querySelectorAll('#entry-list tr').forEach(c => c.classList.remove('active'));
}

function renderDetail(e) {
  document.getElementById('detail-heading').textContent = e.title || e.cite_key;

  const arxivUrl = e.eprint ? `https://arxiv.org/abs/${e.eprint}` : null;
  const linkUrl  = e.doi ? `https://doi.org/${e.doi}` : (e.url || arxivUrl || null);

  const metaRows = [
    ['著者',    e.author || '–'],
    ['年',      e.year ? `${e.year}${e.month ? ' ' + e.month : ''}` : '–'],
    ['掲載誌',  e.journal || '–'],
    ['巻/号',   [e.volume, e.number].filter(Boolean).join(' / ') || '–'],
    ['ページ',  e.pages || '–'],
    ['DOI',     e.doi ? `<a href="https://doi.org/${e.doi}" target="_blank">${esc(e.doi)}</a>` : '–'],
    ['arXiv',   e.eprint ? `<a href="https://arxiv.org/abs/${e.eprint}" target="_blank">${esc(e.eprint)}</a>` : '–'],
    ['URL',     e.url ? `<a href="${esc(e.url)}" target="_blank">リンク</a>` : '–'],
  ];

  const metaHTML = metaRows.filter(([,v]) => v && v !== '–').map(([l,v]) =>
    `<div><span class="meta-label">${l}：</span>${v}</div>`
  ).join('');

  const currentTagNames = (e.tags || []).map(t => t.name);
  const currentKws = (e.keywords || []).map(k => k.name);
  const citsHTML = (e.citations || []).map(c => citationCardHTML(c)).join('');

  document.getElementById('detail-body').innerHTML = `

    <!-- Meta -->
    <div class="detail-section">
      <div class="detail-section-title">📄 書誌情報
        ${linkUrl ? `<a href="${esc(linkUrl)}" target="_blank" style="color:var(--accent);font-size:11px;font-weight:400;margin-left:auto;">外部リンク ↗</a>` : ''}
      </div>
      <div class="detail-meta">${metaHTML}</div>
    </div>

    ${e.abstract ? `
    <div class="detail-section">
      <div class="detail-section-title">📝 アブストラクト</div>
      <div class="abstract-text">${esc(e.abstract)}</div>
    </div>` : ''}

    <!-- Tags -->
    <div class="detail-section">
      <div class="detail-section-title">🏷 タグ</div>
      <div class="tag-editor" id="tag-editor" onclick="focusTagInput()">
        <div id="tag-chips"></div>
        <input class="tag-input" id="tag-input" placeholder="タグを追加…" autocomplete="off">
      </div>
      <div class="autocomplete" id="tag-autocomplete" style="display:none;"></div>
    </div>

    <!-- Keywords -->
    <div class="detail-section">
      <div class="detail-section-title">🔑 キーワード</div>
      <div class="kw-wrap" id="kw-wrap" onclick="focusKwInput()">
        <div id="kw-chips"></div>
        <input class="kw-input" id="kw-input" placeholder="キーワードを追加（Enterで確定）…" autocomplete="off">
      </div>
      <div class="autocomplete" id="kw-autocomplete" style="display:none;"></div>
    </div>

    <!-- Reading note -->
    <div class="detail-section">
      <div class="detail-section-title">📖 実際に何が書かれていたか</div>
      <textarea class="note-area" id="reading-note" rows="5"
        placeholder="自分の読書メモ…"
        onblur="saveReadingNote(${e.id})">${esc(e.reading_note?.content || '')}</textarea>
    </div>

    <!-- Citations in other papers -->
    <div class="detail-section">
      <div class="detail-section-title">💬 他の文献での言及</div>
      <div id="citations-list">${citsHTML}</div>
      <button class="btn" style="margin-top:6px;width:100%;justify-content:center;"
              onclick="addCitationForm(${e.id})">＋ 言及を追加</button>
    </div>

    <!-- BibTeX -->
    <div class="detail-section">
      <div class="detail-section-title">📋 BibTeX</div>
      <div style="position:relative;">
        <div class="bibtex-block" id="bibtex-raw">${esc(e.raw_bibtex || '')}</div>
        <button class="btn copy-btn" onclick="copyBibtex()" title="コピー">📋</button>
      </div>
    </div>

  `;

  initTagEditor(e.id, currentTagNames);
  initKwEditor(e.id, currentKws);
}

// =====================================================================
// Tag editor
// =====================================================================
let _tagState = { entryId: null, names: [], acIdx: -1 };

function initTagEditor(entryId, names) {
  _tagState = { entryId, names: [...names], acIdx: -1 };
  renderTagChips();
  const inp = document.getElementById('tag-input');
  inp.addEventListener('input', onTagInput);
  inp.addEventListener('keydown', onTagKeydown);
  inp.addEventListener('blur', () => setTimeout(hideTagAC, 150));
}

function renderTagChips() {
  document.getElementById('tag-chips').innerHTML = _tagState.names.map((n, i) =>
    `<span class="tag-chip">${esc(n)}<button onclick="removeTag(${i})">×</button></span>`
  ).join('');
}

function focusTagInput() { document.getElementById('tag-input')?.focus(); }

function removeTag(idx) {
  _tagState.names.splice(idx, 1);
  renderTagChips();
  saveTagsDebounced();
}

function onTagInput(e) {
  const q = e.target.value.toLowerCase();
  const ac = document.getElementById('tag-autocomplete');
  if (!q) { hideTagAC(); return; }

  const matches = state.allTags
    .filter(t => t.name.toLowerCase().includes(q) && !_tagState.names.includes(t.name))
    .slice(0, 8);

  if (!matches.length) { hideTagAC(); return; }
  ac.innerHTML = matches.map(t =>
    `<div class="autocomplete-item" data-name="${esc(t.name)}"
          onmousedown="selectTagAC('${esc(t.name)}')">${esc(t.name)}</div>`
  ).join('');
  ac.style.display = '';
  const ed = document.getElementById('tag-editor');
  const rect = ed.getBoundingClientRect();
  const panelRect = document.getElementById('detail-panel').getBoundingClientRect();
  ac.style.left = (rect.left - panelRect.left) + 'px';
  ac.style.top  = (rect.bottom - panelRect.top) + 'px';
  ac.style.width = rect.width + 'px';
}

function hideTagAC() {
  const ac = document.getElementById('tag-autocomplete');
  if (ac) ac.style.display = 'none';
}

function selectTagAC(name) {
  if (!_tagState.names.includes(name)) {
    _tagState.names.push(name);
    renderTagChips();
    saveTagsDebounced();
  }
  document.getElementById('tag-input').value = '';
  hideTagAC();
}

function onTagKeydown(e) {
  const inp = e.target;
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = inp.value.trim();
    if (val && !_tagState.names.includes(val)) {
      _tagState.names.push(val);
      renderTagChips();
      saveTagsDebounced();
    }
    inp.value = '';
    hideTagAC();
  } else if (e.key === 'Backspace' && !inp.value && _tagState.names.length) {
    _tagState.names.pop();
    renderTagChips();
    saveTagsDebounced();
  }
}

let _tagSaveTimer = null;
function saveTagsDebounced() {
  clearTimeout(_tagSaveTimer);
  _tagSaveTimer = setTimeout(() => saveTags(), 600);
}

async function saveTags() {
  await api(`/api/entries/${_tagState.entryId}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ tags: _tagState.names }),
  });
  await loadTags();
  showToast('タグを保存しました', 'ok');
}

// =====================================================================
// Keyword editor (with autocomplete from global list)
// =====================================================================
let _kwState = { entryId: null, kws: [] };

function initKwEditor(entryId, kws) {
  _kwState = { entryId, kws: [...kws] };
  renderKwChips();
  const inp = document.getElementById('kw-input');
  inp.addEventListener('input', onKwInput);
  inp.addEventListener('keydown', onKwKeydown);
  inp.addEventListener('blur', () => setTimeout(hideKwAC, 150));
}

function renderKwChips() {
  document.getElementById('kw-chips').innerHTML = _kwState.kws.map((k, i) =>
    `<span class="kw-chip">${esc(k)}<button onclick="removeKw(${i})">×</button></span>`
  ).join('');
}

function focusKwInput() { document.getElementById('kw-input')?.focus(); }

function removeKw(idx) {
  _kwState.kws.splice(idx, 1);
  renderKwChips();
  saveKwDebounced();
}

function onKwInput(e) {
  const q = e.target.value.toLowerCase();
  const ac = document.getElementById('kw-autocomplete');
  if (!q) { hideKwAC(); return; }

  const matches = state.allKeywords
    .filter(k => k.name.toLowerCase().includes(q) && !_kwState.kws.includes(k.name))
    .slice(0, 8);

  if (!matches.length) { hideKwAC(); return; }
  ac.innerHTML = matches.map(k =>
    `<div class="autocomplete-item" onmousedown="selectKwAC('${esc(k.name)}')">${esc(k.name)}</div>`
  ).join('');
  ac.style.display = '';
  const wrap = document.getElementById('kw-wrap');
  const rect = wrap.getBoundingClientRect();
  const panelRect = document.getElementById('detail-panel').getBoundingClientRect();
  ac.style.left = (rect.left - panelRect.left) + 'px';
  ac.style.top  = (rect.bottom - panelRect.top) + 'px';
  ac.style.width = rect.width + 'px';
}

function hideKwAC() {
  const ac = document.getElementById('kw-autocomplete');
  if (ac) ac.style.display = 'none';
}

function selectKwAC(name) {
  if (!_kwState.kws.includes(name)) {
    _kwState.kws.push(name);
    renderKwChips();
    saveKwDebounced();
  }
  document.getElementById('kw-input').value = '';
  hideKwAC();
}

function onKwKeydown(e) {
  const inp = e.target;
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = inp.value.trim();
    if (val && !_kwState.kws.includes(val)) {
      _kwState.kws.push(val);
      renderKwChips();
      saveKwDebounced();
    }
    inp.value = '';
    hideKwAC();
  } else if (e.key === 'Backspace' && !inp.value && _kwState.kws.length) {
    _kwState.kws.pop();
    renderKwChips();
    saveKwDebounced();
  }
}

let _kwSaveTimer = null;
function saveKwDebounced() {
  clearTimeout(_kwSaveTimer);
  _kwSaveTimer = setTimeout(saveKws, 600);
}

async function saveKws() {
  await api(`/api/entries/${_kwState.entryId}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ keywords: _kwState.kws }),
  });
  await loadKeywords();
  showToast('キーワードを保存しました', 'ok');
}

// =====================================================================
// Reading note
// =====================================================================
async function saveReadingNote(entryId) {
  const content = document.getElementById('reading-note').value;
  await api(`/api/entries/${entryId}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ reading_note: content }),
  });
  showToast('メモを保存しました', 'ok');
}

// =====================================================================
// Citations
// =====================================================================
function citationCardHTML(c) {
  const src = [c.source_cite_key, c.source_title].filter(Boolean).join(' / ');
  return `<div class="citation-card" id="cit-${c.id}">
    ${src ? `<div class="citation-source">出典：${esc(src)}</div>` : ''}
    <div style="font-size:13px;white-space:pre-wrap;">${esc(c.content || '')}</div>
    <div class="citation-actions">
      <button class="btn" style="font-size:11px;" onclick="editCitationForm(${c.id},'${esc2(c.source_cite_key)}','${esc2(c.source_title)}','${esc2(c.content)}')">編集</button>
      <button class="btn btn-danger" style="font-size:11px;" onclick="deleteCitation(${c.id},${state.currentEntryId})">削除</button>
    </div>
  </div>`;
}

function addCitationForm(entryId) {
  const list = document.getElementById('citations-list');
  const formId = 'cit-form-new';
  if (document.getElementById(formId)) return;
  list.insertAdjacentHTML('beforeend', `
    <div id="${formId}" class="citation-card" style="border-color:var(--accent);">
      <input class="inline-input" id="cit-key" placeholder="出典 cite_key（任意）" style="margin-bottom:6px;">
      <input class="inline-input" id="cit-title" placeholder="出典タイトル（任意）" style="margin-bottom:6px;">
      <textarea class="note-area" id="cit-content" rows="3" placeholder="何が書かれていると言っていたか…"></textarea>
      <div class="citation-actions" style="margin-top:6px;">
        <button class="btn btn-primary" onclick="submitNewCitation(${entryId})">保存</button>
        <button class="btn" onclick="document.getElementById('${formId}').remove()">キャンセル</button>
      </div>
    </div>
  `);
  document.getElementById('cit-content').focus();
}

async function submitNewCitation(entryId) {
  const key     = document.getElementById('cit-key').value.trim();
  const title   = document.getElementById('cit-title').value.trim();
  const content = document.getElementById('cit-content').value.trim();
  if (!content) { showToast('内容を入力してください', 'err'); return; }

  await api(`/api/entries/${entryId}/citations`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ source_cite_key: key, source_title: title, content }),
  });
  document.getElementById('cit-form-new').remove();
  openDetail(entryId);
  showToast('言及を追加しました', 'ok');
}

function editCitationForm(citId, key, title, content) {
  const card = document.getElementById(`cit-${citId}`);
  card.innerHTML = `
    <input class="inline-input" id="edit-key-${citId}" value="${esc(key)}" placeholder="出典 cite_key" style="margin-bottom:6px;">
    <input class="inline-input" id="edit-title-${citId}" value="${esc(title)}" placeholder="出典タイトル" style="margin-bottom:6px;">
    <textarea class="note-area" id="edit-content-${citId}" rows="3">${esc(content)}</textarea>
    <div class="citation-actions" style="margin-top:6px;">
      <button class="btn btn-primary" onclick="submitEditCitation(${citId})">保存</button>
      <button class="btn" onclick="openDetail(${state.currentEntryId})">キャンセル</button>
    </div>
  `;
}

async function submitEditCitation(citId) {
  const key     = document.getElementById(`edit-key-${citId}`).value.trim();
  const title   = document.getElementById(`edit-title-${citId}`).value.trim();
  const content = document.getElementById(`edit-content-${citId}`).value.trim();
  await api(`/api/citations/${citId}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ source_cite_key: key, source_title: title, content }),
  });
  openDetail(state.currentEntryId);
  showToast('言及を更新しました', 'ok');
}

async function deleteCitation(citId, entryId) {
  if (!confirm('この言及を削除しますか？')) return;
  await api(`/api/citations/${citId}`, { method: 'DELETE' });
  openDetail(entryId);
  showToast('削除しました', 'ok');
}

function copyBibtex() {
  const text = document.getElementById('bibtex-raw').textContent;
  navigator.clipboard.writeText(text).then(() => showToast('コピーしました', 'ok'));
}

// =====================================================================
// Import .bib modal
// =====================================================================
function openImportModal() {
  document.getElementById('import-modal').classList.add('open');
  document.getElementById('import-result').style.display = 'none';
  document.getElementById('bib-file-input').value = '';
}

function closeImportModal() {
  document.getElementById('import-modal').classList.remove('open');
  loadEntries();
  loadTags();
  loadStats();
}

async function importBibFile(file) {
  const fd = new FormData();
  fd.append('file', file);
  const res = document.getElementById('import-result');
  res.style.display = '';
  res.innerHTML = '<span class="spinner"></span> インポート中…';
  try {
    const data = await fetch('/api/import', { method: 'POST', body: fd }).then(r => r.json());
    res.innerHTML = `✅ 追加: <b>${data.added}</b>件　更新: <b>${data.updated}</b>件　スキップ: <b>${data.skipped}</b>件`;
    showToast('インポート完了', 'ok');
  } catch (err) {
    res.innerHTML = '❌ インポートに失敗しました: ' + err.message;
    showToast('インポート失敗', 'err');
  }
}

// =====================================================================
// Notion CSV import modal
// =====================================================================
function openNotionModal() {
  document.getElementById('notion-modal').classList.add('open');
  document.getElementById('notion-result').style.display = 'none';
  document.getElementById('notion-file-input').value = '';
}

function closeNotionModal() {
  document.getElementById('notion-modal').classList.remove('open');
  loadEntries();
  loadTags();
  loadKeywords();
  loadStats();
}

async function importNotionFile(file) {
  const fd = new FormData();
  fd.append('file', file);
  const res = document.getElementById('notion-result');
  res.style.display = '';
  res.innerHTML = '<span class="spinner"></span> インポート中…';
  try {
    const data = await fetch('/api/notion-import', { method: 'POST', body: fd }).then(r => r.json());
    let html = `✅ マッチ: <b>${data.matched}</b>件　未マッチ: <b>${data.not_found}</b>件`;
    if (data.errors && data.errors.length) {
      html += `<div class="notion-errors">${data.errors.map(e => esc(e)).join('<br>')}</div>`;
    }
    res.innerHTML = html;
    showToast('Notionインポート完了', 'ok');
  } catch (err) {
    res.innerHTML = '❌ インポートに失敗しました: ' + err.message;
    showToast('インポート失敗', 'err');
  }
}

// =====================================================================
// Toast
// =====================================================================
let _toastTimer = null;
function showToast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.className = '', 2200);
}

// =====================================================================
// Utils
// =====================================================================
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function esc2(s) {
  if (s == null) return '';
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
}
