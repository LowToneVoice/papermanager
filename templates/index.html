<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BibManager</title>
<style>
  /* ── Design tokens ── */
  :root {
    --bg:        #0f1117;
    --bg2:       #181c27;
    --bg3:       #1e2335;
    --border:    #2a3050;
    --accent:    #4f8ef7;
    --accent2:   #7c5cbf;
    --green:     #3ecf7a;
    --yellow:    #f5c842;
    --red:       #e05c5c;
    --text:      #e2e6f0;
    --muted:     #8892ab;
    --radius:    8px;
    --font-mono: 'JetBrains Mono', 'Fira Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', 'Hiragino Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: grid;
    grid-template-rows: 52px 1fr;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
  }
  .logo {
    font-weight: 700;
    font-size: 15px;
    color: var(--accent);
    letter-spacing: .04em;
    white-space: nowrap;
  }
  .search-wrap {
    flex: 1;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
  }
  #search {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 14px;
    padding: 7px 12px 7px 34px;
    outline: none;
    transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }

  .header-actions { display: flex; gap: 8px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 13px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--border); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #3a7de8; }
  .btn-danger  { color: var(--red); }
  .btn-danger:hover { border-color: var(--red); }
  .btn-notion { background: var(--bg3); border-color: #555; color: var(--text); }
  .btn-notion:hover { border-color: var(--accent2); }

  /* ── Main layout ── */
  .main {
    display: grid;
    grid-template-columns: 220px 1fr;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  aside {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-section {
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 2px 0;
  }
  .stat-val { color: var(--accent); font-weight: 700; }

  /* Year filter */
  .year-inputs { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .year-inputs input {
    width: 64px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-size: 12px;
    padding: 5px 7px;
    outline: none;
  }
  .year-inputs input:focus { border-color: var(--accent); }

  /* Tags / Keywords sidebar list */
  .filter-list {
    overflow-y: auto;
    padding: 6px;
    flex-shrink: 0;
    max-height: 220px;
  }
  .filter-list.kw-list {
    border-top: 1px solid var(--border);
    flex: 1;
  }
  .tag-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: background .12s;
  }
  .tag-item:hover { background: var(--bg3); }
  .tag-item.active { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .tag-item.active-kw { background: color-mix(in srgb, var(--green) 18%, transparent); }
  .tag-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent2);
    flex-shrink: 0;
  }
  .kw-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }
  .tag-name { flex: 1; }
  .tag-count {
    font-size: 11px;
    color: var(--muted);
    background: var(--bg3);
    border-radius: 10px;
    padding: 1px 6px;
  }

  /* ── Entry list ── */
  .list-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .list-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  .list-toolbar .count { margin-left: auto; }
  .entry-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .entry-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 6px;
    cursor: pointer;
    user-select: none;
  }

  /* ── Table view ── */
  .entry-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .entry-table thead {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg3);
  }
  .entry-table th {
    padding: 8px 12px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  .entry-table th:hover { color: var(--text); }
  .entry-table th .sort-arrow { margin-left: 3px; opacity: .5; }
  .entry-table th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
  .entry-table tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .1s;
  }
  .entry-table tbody tr:hover { background: var(--bg3); }
  .entry-table tbody tr.active {
    background: color-mix(in srgb, var(--accent) 10%, var(--bg2));
  }
  .entry-table td {
    padding: 7px 12px;
    vertical-align: top;
    line-height: 1.4;
  }
  .td-yyyymm {
    width: 62px;
    color: var(--yellow);
    font-weight: 700;
    white-space: nowrap;
    font-size: 12px;
  }
  .td-title {
    min-width: 180px;
    max-width: 280px;
  }
  .td-title-text {
    font-weight: 600;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .td-authors {
    width: 140px;
    max-width: 140px;
    color: var(--muted);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 12px;
  }
  .td-tags { width: 120px; }
  .td-tags-wrap { display: flex; flex-wrap: wrap; gap: 3px; }
  .td-note {
    max-width: 200px;
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .entry-year {
    font-size: 12px;
    color: var(--yellow);
    font-weight: 700;
    white-space: nowrap;
    font-family: var(--font-mono);
  }
  .td-type {
    width: 70px;
  }
  .type-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--bg3);
    color: var(--muted);
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .tag-badge {
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--accent2) 20%, transparent);
    color: color-mix(in srgb, var(--accent2) 80%, var(--text));
    border: 1px solid color-mix(in srgb, var(--accent2) 40%, transparent);
    white-space: nowrap;
  }
  .arxiv-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--red) 15%, transparent);
    color: #e08080;
    border: 1px solid color-mix(in srgb, var(--red) 30%, transparent);
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }

  /* ── Detail panel ── */
  .detail-panel {
    position: fixed;
    top: 52px;
    right: 0;
    bottom: 0;
    width: 480px;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform .22s ease;
    z-index: 100;
  }
  .detail-panel.open { transform: none; }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .detail-header h2 {
    font-size: 15px;
    font-weight: 700;
    flex: 1;
    min-width: 0;
  }
  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .detail-section { margin-bottom: 20px; }
  .detail-section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .detail-meta { font-size: 13px; line-height: 1.8; }
  .detail-meta a { color: var(--accent); text-decoration: none; }
  .detail-meta a:hover { text-decoration: underline; }
  .meta-label { color: var(--muted); }

  /* Tag editor */
  .tag-editor {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 40px;
    cursor: text;
  }
  .tag-editor .tag-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: color-mix(in srgb, var(--accent2) 25%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent2) 50%, transparent);
    border-radius: 12px;
    font-size: 12px;
    padding: 2px 8px 2px 10px;
  }
  .tag-chip button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
  }
  .tag-chip button:hover { color: var(--red); }
  .tag-input {
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    min-width: 80px;
    flex: 1;
  }
  .autocomplete {
    position: absolute;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 200;
    max-height: 240px;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .autocomplete-item {
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .autocomplete-item:hover,
  .autocomplete-item.hl { background: var(--border); }

  /* Keyword editor (global list, same UX as tags) */
  .kw-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 40px;
    cursor: text;
  }
  .kw-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: color-mix(in srgb, var(--green) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--green) 35%, transparent);
    border-radius: 12px;
    font-size: 12px;
    padding: 2px 8px 2px 10px;
    color: color-mix(in srgb, var(--green) 80%, var(--text));
  }
  .kw-chip button {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 14px; line-height: 1; padding: 0;
  }
  .kw-chip button:hover { color: var(--red); }
  .kw-input {
    border: none; outline: none; background: transparent;
    color: var(--text); font-size: 13px; min-width: 80px; flex: 1;
  }

  /* Textarea */
  textarea.note-area {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    padding: 10px 12px;
    resize: vertical;
    min-height: 100px;
    outline: none;
    transition: border-color .15s;
  }
  textarea.note-area:focus { border-color: var(--accent); }

  /* Citation cards */
  .citation-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .citation-source {
    font-size: 11px;
    color: var(--yellow);
    margin-bottom: 4px;
    font-style: italic;
  }
  .citation-actions { display: flex; gap: 6px; margin-top: 6px; }

  /* BibTeX block */
  .bibtex-block {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    font-size: 12px;
    font-family: var(--font-mono);
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.6;
    color: #a8c4e8;
    max-height: 280px;
    overflow-y: auto;
    position: relative;
  }
  .copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
  }

  /* Abstract */
  .abstract-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
    background: var(--bg3);
    border-radius: var(--radius);
    padding: 10px 12px;
    max-height: 160px;
    overflow-y: auto;
  }

  /* Inline editable inputs */
  .inline-input {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-size: 13px;
    padding: 5px 8px;
    outline: none;
    width: 100%;
  }
  .inline-input:focus { border-color: var(--accent); }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 18px;
    font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    z-index: 9999;
  }
  #toast.show { opacity: 1; transform: none; }
  #toast.ok   { border-color: var(--green); color: var(--green); }
  #toast.err  { border-color: var(--red);   color: var(--red); }

  /* Loading */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 440px;
    max-width: 95vw;
  }
  .modal h3 { font-size: 16px; margin-bottom: 16px; }
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    margin-bottom: 14px;
  }
  .drop-zone:hover, .drop-zone.over {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 5%, transparent);
  }
  .import-result {
    background: var(--bg3);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  /* ── Add-entry / Manage tabs ── */
  .add-tab {
    padding: 5px 14px; font-size: 12px; cursor: pointer;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--bg3); color: var(--muted);
  }
  .add-tab-active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .add-tab:hover:not(.add-tab-active) { border-color: var(--accent); color: var(--text); }

  /* ── Meta / Add entry form rows ── */
  .meta-edit-form { display: flex; flex-direction: column; gap: 6px; }
  .meta-edit-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .meta-edit-row label { width: 72px; flex-shrink: 0; color: var(--muted); font-size: 12px; }
  .meta-edit-row input, .meta-edit-row select, .meta-edit-row textarea {
    flex: 1; min-width: 0; background: var(--bg3);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); padding: 4px 8px; font-size: 13px;
  }
  .meta-edit-row input:focus, .meta-edit-row select:focus, .meta-edit-row textarea:focus {
    border-color: var(--accent); outline: none;
  }
  .meta-edit-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

  /* ── Duplicate-check modal ── */
  .dupe-group { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .dupe-group-header { padding: 6px 12px; font-size: 12px; color: var(--muted); background: var(--bg3); }
  .dupe-entry { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); }
  .dupe-entry-info { flex: 1; min-width: 0; }
  .dupe-entry-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dupe-entry-sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Manage tags/keywords modal ── */
  .manage-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .manage-name { flex: 1; min-width: 0; font-size: 13px; }

  /* Responsive: when detail panel is open, shrink list */
  .detail-panel.open ~ * { /* not needed; overlay approach */ }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <span class="logo">📚 BibManager</span>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search" type="text" placeholder="タイトル・著者・キーワード・メモを検索…（/ でフォーカス）">
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" id="btn-add">＋ 文献を追加</button>
    <button class="btn" id="btn-import">⬆ Import .bib</button>
    <button class="btn btn-notion" id="btn-notion">📥 Notion CSV</button>
    <button class="btn" id="btn-export">⬇ Export .bib</button>
    <button class="btn" id="btn-dupes" title="重複を検出する">⚠ 重複チェック</button>
  </div>
</header>

<!-- ── MAIN ── -->
<div class="main">

  <!-- Sidebar -->
  <aside>
    <div class="sidebar-section">
      <div class="sidebar-label">統計</div>
      <div class="stat-row"><span>総文献数</span><span class="stat-val" id="stat-total">–</span></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">年フィルタ</div>
      <div class="year-inputs">
        <input type="number" id="year-from" placeholder="1900" min="1900" max="2100">
        <span>–</span>
        <input type="number" id="year-to" placeholder="2099" min="1900" max="2100">
      </div>
    </div>

    <div class="sidebar-section" style="border-bottom:none; padding-bottom:4px;">
      <div class="sidebar-label">
        <span>タグ</span>

<div id="toast"></div>

<script>
// =====================================================================
// State
// =====================================================================
let state = {
  query: '',
  tags: [],        // active tag IDs (AND)
  kws:  [],        // active keyword IDs (AND)
  yearFrom: null,
  yearTo: null,
  offset: 0,
  limit: 2000,     // load all at once
  total: 0,
  allTags: [],     // [{id, name, count}]
  allKeywords: [], // [{id, name, count}]
  currentEntryId: null,
  debounceTimer: null,
  sortCol: 'year',
  sortDir: -1,     // -1 = desc, 1 = asc
};

let _cachedEntries = [];

// =====================================================================
// Init
// =====================================================================
document.addEventListener('DOMContentLoaded', async () => {
  await Promise.all([loadTags(), loadKeywords(), loadStats()]);
  await loadEntries();
  bindEvents();
});

function bindEvents() {
  // Search
  document.getElementById('search').addEventListener('input', e => {
    clearTimeout(state.debounceTimer);
    state.debounceTimer = setTimeout(() => {
      state.query = e.target.value.trim();
      state.offset = 0;
      loadEntries();
    }, 280);
  });

  // Year filters
  ['year-from', 'year-to'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      state.yearFrom = parseInt(document.getElementById('year-from').value) || null;
      state.yearTo   = parseInt(document.getElementById('year-to').value)   || null;
      state.offset = 0;
      loadEntries();
    });
  });

  // Keyboard shortcut
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault();
      document.getElementById('search').focus();
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      const active = document.activeElement;
      if (active && (active.tagName === 'TEXTAREA' || active.tagName === 'INPUT') && active.id !== 'search') {
        active.blur();
      } else {
        closeDetail();
      }
    }
  });

  // Import / Export
  document.getElementById('btn-add').onclick    = () => openAddModal();
  document.getElementById('btn-import').onclick = () => openImportModal();
  document.getElementById('btn-export').onclick = () => { window.location = '/api/export'; };

  // .bib Drop zone
  const dz = document.getElementById('drop-zone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f) importBibFile(f);
  });
  document.getElementById('bib-file-input').addEventListener('change', e => {
    if (e.target.files[0]) importBibFile(e.target.files[0]);
  });

  // Notion CSV Drop zone
  const ndz = document.getElementById('notion-drop-zone');
  ndz.addEventListener('dragover', e => { e.preventDefault(); ndz.classList.add('over'); });
  ndz.addEventListener('dragleave', () => ndz.classList.remove('over'));
  ndz.addEventListener('drop', e => {
    e.preventDefault();
    ndz.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f) importNotionFile(f);
  });
  document.getElementById('notion-file-input').addEventListener('change', e => {
    if (e.target.files[0]) importNotionFile(e.target.files[0]);
  });
}

// =====================================================================
// API helpers
// =====================================================================
async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// =====================================================================
// Load & render tags
// =====================================================================
async function loadTags() {
  const tags = await api('/api/tags');
  state.allTags = tags;
  renderTags();
}

function renderTags() {
  const el = document.getElementById('tags-list');
  if (!state.allTags.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:8px;">タグなし</div>';
    return;
  }
  el.innerHTML = state.allTags.map(t => `
    <div class="tag-item ${state.tags.includes(t.id) ? 'active' : ''}"
         onclick="toggleTag(${t.id})">
      <div class="tag-dot"></div>
      <span class="tag-name">${esc(t.name)}</span>
      <span class="tag-count">${t.count}</span>
    </div>
  `).join('');
  document.getElementById('tag-clear').style.display = state.tags.length ? '' : 'none';
}

function toggleTag(id) {
  const idx = state.tags.indexOf(id);
  if (idx === -1) state.tags.push(id);
  else state.tags.splice(idx, 1);
  state.offset = 0;
  renderTags();
  loadEntries();
}

function clearTagFilter() {
  state.tags = [];
  state.offset = 0;
  renderTags();
  loadEntries();
}

// =====================================================================
// Load & render keywords
// =====================================================================
async function loadKeywords() {
  const kws = await api('/api/keywords');
  state.allKeywords = kws;
  renderKeywords();
}

function renderKeywords() {
  const el = document.getElementById('keywords-list');
  if (!state.allKeywords.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:8px;">キーワードなし</div>';
    return;
  }
  el.innerHTML = state.allKeywords.map(k => `
    <div class="tag-item ${state.kws.includes(k.id) ? 'active-kw' : ''}"
         onclick="toggleKw(${k.id})">
      <div class="kw-dot"></div>
      <span class="tag-name">${esc(k.name)}</span>
      <span class="tag-count">${k.count}</span>
    </div>
  `).join('');
  document.getElementById('kw-clear').style.display = state.kws.length ? '' : 'none';
}

function toggleKw(id) {
  const idx = state.kws.indexOf(id);
  if (idx === -1) state.kws.push(id);
  else state.kws.splice(idx, 1);
  state.offset = 0;
  renderKeywords();
  loadEntries();
}

function clearKwFilter() {
  state.kws = [];
  state.offset = 0;
  renderKeywords();
  loadEntries();
}

// =====================================================================
// Load & render stats
// =====================================================================
async function loadStats() {
  const s = await api('/api/stats');
  document.getElementById('stat-total').textContent = s.total.toLocaleString();
}

// =====================================================================
// Load & render entries
// =====================================================================
async function loadEntries() {
  const params = new URLSearchParams({
    q:      state.query,
    limit:  state.limit,
    offset: state.offset,
  });
  if (state.yearFrom) params.append('year_from', state.yearFrom);
  if (state.yearTo)   params.append('year_to',   state.yearTo);
  state.tags.forEach(tid => params.append('tag', tid));
  state.kws.forEach(kid  => params.append('kw',  kid));

  document.getElementById('list-status').innerHTML = '<span class="spinner"></span>';

  const data = await api('/api/entries?' + params.toString());
  state.total = data.total;
  _cachedEntries = data.entries;

  renderTable();
}

function renderTable() {
  const el = document.getElementById('entry-list');

  if (!_cachedEntries.length) {
    el.innerHTML = `<div style="text-align:center;padding:48px 0;color:var(--muted);">
      <div style="font-size:32px;margin-bottom:8px;">🔍</div>
      <div>文献が見つかりません</div>
    </div>`;
    document.getElementById('list-status').textContent = '0件';
    document.getElementById('list-count').textContent = '';
    renderPagination(state.total);
    return;
  }

  // Client-side sort
  const sorted = [..._cachedEntries].sort((a, b) => {
    let va, vb;
    if (state.sortCol === 'year') {
      va = getYYYYMM(a);
      vb = getYYYYMM(b);
    } else {
      va = a[state.sortCol] ?? '';
      vb = b[state.sortCol] ?? '';
    }
    if (va < vb) return -state.sortDir;
    if (va > vb) return  state.sortDir;
    return 0;
  });

  const cols = [
    { key: 'year',    label: 'YYYYMM',    cls: 'td-yyyymm' },
    { key: 'title',   label: 'タイトル',  cls: 'td-title' },
    { key: 'author',  label: '著者',      cls: 'td-authors' },
    { key: 'tags',    label: 'タグ',      cls: 'td-tags',  noSort: true },
    { key: 'keywords',label: 'KW',        cls: 'td-tags',  noSort: true },
    { key: '_note',   label: '読書メモ',  cls: 'td-note',  noSort: true },
    { key: '_cit',    label: '他文献言及', cls: 'td-note', noSort: true },
  ];

  const thead = cols.map(c => {
    const isSorted = state.sortCol === c.key;
    const arrow = c.noSort ? '' : `<span class="sort-arrow">${isSorted ? (state.sortDir === 1 ? '▲' : '▼') : '▲'}</span>`;
    const onclick = c.noSort ? '' : `onclick="sortBy('${c.key}')"`;
    return `<th class="${c.cls} ${isSorted ? 'sorted' : ''}" ${onclick}>${c.label}${arrow}</th>`;
  }).join('');

  const tbody = sorted.map(e => {
    const yyyymm  = getYYYYMM(e);
    const authors = formatAuthors(e.author);
    const tags    = (e.tags || []).map(t => `<span class="tag-badge">${esc(t.name)}</span>`).join('');
    const kws     = (e.keywords || []).map(k => `<span class="tag-badge" style="border-color:var(--accent2)">${esc(k)}</span>`).join('');

    return `<tr onclick="openDetail(${e.id})" id="ec-${e.id}"
                class="${state.currentEntryId === e.id ? 'active' : ''}">
      <td class="td-yyyymm">${yyyymm}</td>
      <td class="td-title"><div class="td-title-text">${esc(e.title || '(タイトルなし)')}</div></td>
      <td class="td-authors">${esc(authors)}</td>
      <td class="td-tags"><div class="td-tags-wrap">${tags}</div></td>
      <td class="td-tags"><div class="td-tags-wrap">${kws}</div></td>
      <td class="td-note">${esc(e.reading_note || '')}</td>
      <td class="td-note">${esc(e.citations_text || '')}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `<table class="entry-table">
    <thead><tr>${thead}</tr></thead>
    <tbody>${tbody}</tbody>
  </table>`;

  document.getElementById('list-status').textContent = `${state.total.toLocaleString()} 件`;
  document.getElementById('list-count').textContent =
    `${state.offset + 1}–${Math.min(state.offset + state.limit, state.total)} 件表示`;

  renderPagination(state.total);
}

function sortBy(col) {
  if (state.sortCol === col) {
    state.sortDir *= -1;
  } else {
    state.sortCol = col;
    state.sortDir = col === 'year' ? -1 : 1;
  }
  renderTable();
}

function getYYYYMM(e) {
  if (e.eprint) {
    // New arXiv format: YYMM.NNNNN
    const m1 = e.eprint.match(/^(\d{2})(\d{2})\.\d/);
    if (m1) {
      const yy = parseInt(m1[1]);
      const yyyy = yy >= 91 ? 1900 + yy : 2000 + yy;
      return `${yyyy}${m1[2]}`;
    }
    // Old arXiv format: hep-th/YYMMNNN
    const m2 = e.eprint.match(/\/(\d{2})(\d{2})\d/);
    if (m2) {
      const yy = parseInt(m2[1]);
      const yyyy = yy >= 91 ? 1900 + yy : 2000 + yy;
      return `${yyyy}${m2[2]}`;
    }
  }
  if (e.year) {
    return `${e.year}${_monthNum(e.month)}`;
  }
  return '?';
}

function _monthNum(month) {
  if (!month) return '00';
  if (/^\d+$/.test(month)) return String(parseInt(month)).padStart(2, '0');
  const map = {jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',
               jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  return map[month.toLowerCase().slice(0,3)] || '00';
}

function entryCardHTML(e) {
  const authors = formatAuthors(e.author);
  const tags    = (e.tags || []).map(t => `<span class="tag-badge">${esc(t.name)}</span>`).join('');
  const arxiv   = e.eprint ? `<span class="arxiv-badge">arXiv:${esc(e.eprint)}</span>` : '';

  return `<div class="entry-card ${state.currentEntryId === e.id ? 'active' : ''}"
              onclick="openDetail(${e.id})" id="ec-${e.id}">
    <div class="entry-card-top">
      <span class="entry-year">${e.year || '?'}</span>
      <span class="entry-type-badge">${e.entry_type}</span>
      ${arxiv}
    </div>
    <div class="entry-title">${esc(e.title || '(タイトルなし)')}</div>
    <div class="entry-authors">${esc(authors)}</div>
    ${tags ? `<div class="entry-tags">${tags}</div>` : ''}
  </div>`;
}

function formatAuthors(authorStr) {
  if (!authorStr) return '著者不明';
  const parts = authorStr.split(' | ');
  if (parts.length <= 3) return parts.join(', ');
  return parts.slice(0, 3).join(', ') + ` et al. (${parts.length}名)`;
}

function renderPagination(total) {
  const pages = Math.ceil(total / state.limit);
  const cur   = Math.floor(state.offset / state.limit);
  if (pages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }

  let html = `<button class="btn" ${cur === 0 ? 'disabled' : ''} onclick="goPage(${cur-1})">← 前</button>`;
  html += `<span style="color:var(--muted);font-size:13px;">${cur+1} / ${pages}</span>`;
  html += `<button class="btn" ${cur >= pages-1 ? 'disabled' : ''} onclick="goPage(${cur+1})">次 →</button>`;
  document.getElementById('pagination').innerHTML = html;
}

function goPage(p) {
  state.offset = p * state.limit;
  loadEntries();
  document.getElementById('entry-list').scrollTo(0, 0);
}

// =====================================================================
// Detail panel
// =====================================================================
async function openDetail(entryId) {
  // flush any unsaved changes BEFORE destroying current editors
  await Promise.all([flushNote(), flushTags(), flushKws()]);

  state.currentEntryId = entryId;
  document.querySelectorAll('#entry-list tr').forEach(c => c.classList.remove('active'));
  const card = document.getElementById(`ec-${entryId}`);
  if (card) card.classList.add('active');

  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('detail-body').innerHTML =
    '<div style="display:flex;justify-content:center;padding:40px;"><span class="spinner"></span></div>';

  const entry = await api(`/api/entries/${entryId}`);
  renderDetail(entry);
}

async function closeDetail() {
  await Promise.all([flushNote(), flushTags(), flushKws()]);  // 未保存の変更を即時保存してから閉じる
  state.currentEntryId = null;
  document.getElementById('detail-panel').classList.remove('open');
  document.querySelectorAll('#entry-list tr').forEach(c => c.classList.remove('active'));
}

function renderDetail(e) {
  document.getElementById('detail-heading').textContent = e.title || e.cite_key;
  // Reset edit button state whenever a new entry is rendered
  const editBtn = document.getElementById('btn-edit-meta');

// =====================================================================
// Meta edit
// =====================================================================
function toggleMetaEdit() {
  const viewSec = document.getElementById('meta-view-section');
  const editSec = document.getElementById('meta-edit-section');
  const absSec  = document.getElementById('abstract-section');
  const btn     = document.getElementById('btn-edit-meta');
  if (!viewSec || !editSec) return;

  const editing = editSec.style.display !== 'none';
  viewSec.style.display = editing ? '' : 'none';
  editSec.style.display = editing ? 'none' : '';
  if (absSec) absSec.style.display = editing ? '' : 'none';
  if (btn) btn.textContent = editing ? '✏ 編集' : '✕ 編集中';

  if (!editing) document.getElementById('ef-title')?.focus();
}

async function saveMetaEdit(entryId) {
  const val = id => document.getElementById(id)?.value.trim() ?? '';
  const fields = {
    entry_type: val('ef-entry-type'),
    cite_key:   val('ef-cite-key'),
    title:      val('ef-title'),
    author:     val('ef-author'),
    year:       val('ef-year') ? parseInt(val('ef-year')) : null,
    month:      val('ef-month'),
    journal:    val('ef-journal'),
    volume:     val('ef-volume'),
    number:     val('ef-number'),
    pages:      val('ef-pages'),
    doi:        val('ef-doi'),
    eprint:     val('ef-eprint'),
    url:        val('ef-url'),
    abstract:   document.getElementById('ef-abstract')?.value.trim() ?? '',
  };

  try {
    const updated = await api(`/api/entries/${entryId}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(fields),
    });
    // Re-render detail with returned data
    renderDetail(updated);
    // Re-render table row title/year in background
    const idx = _cachedEntries.findIndex(e => e.id === entryId);
    if (idx !== -1) {
      _cachedEntries[idx].title  = updated.title;
      _cachedEntries[idx].author = updated.author;
      _cachedEntries[idx].year   = updated.year;
      _cachedEntries[idx].eprint = updated.eprint;
      renderTable();
    }
    showToast('書誌情報を保存しました', 'ok');
    // Refresh stats in case cite_key changed
    loadStats();
  } catch(e) {
    showToast('保存に失敗しました', 'err');
  }
}

// =====================================================================
// Entry delete
// =====================================================================
async function deleteCurrentEntry() {
  if (!state.currentEntryId) return;
  const title = document.getElementById('detail-heading')?.textContent || '(不明)';
  if (!confirm(`「${title}」を削除しますか？\nこの操作は取り消せません。`)) return;

  await api(`/api/entries/${state.currentEntryId}`, { method: 'DELETE' });
  // Remove from cache and re-render
  _cachedEntries = _cachedEntries.filter(e => e.id !== state.currentEntryId);
  state.total = Math.max(0, state.total - 1);
  renderTable();
  closeDetail();
  loadStats();
  showToast('文献を削除しました', 'ok');
}

// =====================================================================
// Generic autocomplete dropdown helper
// =====================================================================
// Used by both tag and keyword editors.
// ac     : { acId, anchorId, items: [{name}], selectedNames: [], acIdx, onSelect }
// =====================================================================

function _showAC({ acId, anchorId, items, acIdx }) {
  const ac = document.getElementById(acId);
  if (!ac) return;
  if (!items.length) { _hideAC(acId); return; }

  ac.innerHTML = items.map((item, i) =>
    `<div class="autocomplete-item${i === acIdx ? ' hl' : ''}"
          data-idx="${i}"
          onmousedown="event.preventDefault()"
          onclick="_acItemClick('${acId}','${esc(item.name)}')"
     >${esc(item.name)}</div>`
  ).join('');

  // Position below the anchor element
  const anchor = document.getElementById(anchorId);
  const panel  = document.getElementById('detail-panel');
  if (anchor && panel) {
    const ar = anchor.getBoundingClientRect();
    const pr = panel.getBoundingClientRect();
    ac.style.left  = (ar.left  - pr.left) + 'px';
    ac.style.top   = (ar.bottom - pr.top) + 'px';
    ac.style.width = ar.width + 'px';
  }
  ac.style.display = '';

  // Scroll highlighted item into view
  const hl = ac.querySelector('.hl');
  if (hl) hl.scrollIntoView({ block: 'nearest' });
}

function _hideAC(acId) {
  const ac = document.getElementById(acId);
  if (ac) ac.style.display = 'none';
}

// Called by onclick on each item (set in _showAC)
function _acItemClick(acId, name) {
  if (acId === 'tag-autocomplete') selectTagAC(name);
  else if (acId === 'kw-autocomplete') selectKwAC(name);
}

// Tag editor

let _tagState = { entryId: null, names: [], acIdx: -1, acItems: [] };

function initTagEditor(entryId, names) {
  _tagState = { entryId, names: [...names], acIdx: -1, acItems: [] };
  renderTagChips();
  const inp = document.getElementById('tag-input');
  inp.addEventListener('focus', () => _refreshTagAC());
  inp.addEventListener('input', () => _refreshTagAC());
  inp.addEventListener('keydown', onTagKeydown);
  inp.addEventListener('blur', () => setTimeout(() => _hideAC('tag-autocomplete'), 150));
}

function _refreshTagAC() {
  const inp = document.getElementById('tag-input');
  if (!inp) return;
  const q = inp.value.toLowerCase();
  _tagState.acItems = state.allTags
    .filter(t => !_tagState.names.includes(t.name))
    .filter(t => !q || t.name.toLowerCase().includes(q));
  _tagState.acIdx = -1;
  _showAC({ acId: 'tag-autocomplete', anchorId: 'tag-editor',
            items: _tagState.acItems, acIdx: _tagState.acIdx });
}

function renderTagChips() {
  document.getElementById('tag-chips').innerHTML = _tagState.names.map((n, i) =>
    `<span class="tag-chip">${esc(n)}<button onclick="removeTag(${i})">×</button></span>`
  ).join('');
}

function focusTagInput() { document.getElementById('tag-input')?.focus(); }

function removeTag(idx) {
  _tagState.names.splice(idx, 1);
  renderTagChips();
  saveTagsDebounced();
}

function onTagInput(e) {
  const q = e.target.value.toLowerCase();
  const ac = document.getElementById('tag-autocomplete');
  if (!q) { hideTagAC(); return; }

  const matches = state.allTags
    .filter(t => t.name.toLowerCase().includes(q) && !_tagState.names.includes(t.name))
    .slice(0, 8);

  if (!matches.length) { hideTagAC(); return; }
  ac.innerHTML = matches.map((t, i) =>
    `<div class="autocomplete-item" data-name="${esc(t.name)}"
          onmousedown="selectTagAC('${esc(t.name)}')">${esc(t.name)}</div>`
  ).join('');
  ac.style.display = '';
  // Position below editor
  const ed = document.getElementById('tag-editor');
  const rect = ed.getBoundingClientRect();
  const panelRect = document.getElementById('detail-panel').getBoundingClientRect();
  ac.style.left = (rect.left - panelRect.left) + 'px';
  ac.style.top  = (rect.bottom - panelRect.top) + 'px';
  ac.style.width = rect.width + 'px';
  document.getElementById('detail-panel').style.position = 'fixed';
  _tagState.acIdx = -1;
}

function hideTagAC() {
  const ac = document.getElementById('tag-autocomplete');
  if (ac) ac.style.display = 'none';
}

function selectTagAC(name) {
  if (!_tagState.names.includes(name)) {
    _tagState.names.push(name);
    renderTagChips();
    saveTagsDebounced();
  }
  const inp = document.getElementById('tag-input');
  if (inp) { inp.value = ''; inp.focus(); }
  _refreshTagAC();
}

function onTagKeydown(e) {
  const inp = e.target;
  const ac = document.getElementById('tag-autocomplete');
  const items = ac ? [...ac.querySelectorAll('.autocomplete-item')] : [];

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _tagState.acIdx = Math.min(_tagState.acIdx + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('hl', i === _tagState.acIdx));
    return;
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    _tagState.acIdx = Math.max(_tagState.acIdx - 1, 0);
    items.forEach((el, i) => el.classList.toggle('hl', i === _tagState.acIdx));
    return;
  }
  if (e.key === 'Escape') {
    hideTagAC();
    inp.blur();
    return;
  }
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    if (_tagState.acIdx >= 0 && items[_tagState.acIdx]) {
      selectTagAC(items[_tagState.acIdx].dataset.name);
      _tagState.acIdx = -1;
    } else {
      const val = inp.value.trim();
      if (val && !_tagState.names.includes(val)) {
        _tagState.names.push(val);
        renderTagChips();
        saveTagsDebounced();
      }
      inp.value = '';
      hideTagAC();
    }
    return;
  }
  if (e.key === 'Backspace' && !inp.value && _tagState.names.length) {
    _tagState.names.pop();
    renderTagChips();
    saveTagsDebounced();
  }
  _tagState.acIdx = -1;
}

let _tagSaveTimer = null;
function saveTagsDebounced() {
  clearTimeout(_tagSaveTimer);
  _tagSaveTimer = setTimeout(() => { _tagSaveTimer = null; saveTags(); }, 600);
}

async function flushTags() {
  if (_tagSaveTimer === null || !_tagState.entryId) return;

async function saveTags() {

    body: JSON.stringify({ tags: _tagState.names }),
  });
  await loadTags();
  showToast('タグを保存しました', 'ok');
}

// =====================================================================
// Arrow-key index helper
// =====================================================================
function _moveIdx(cur, len, dir) {
  if (len === 0) return -1;
  if (cur === -1) return dir === 1 ? 0 : len - 1;
  return (cur + dir + len) % len;
}

// =====================================================================
// Reading note – auto-save on input + force-save on close / entry switch
// =====================================================================

// _note stores content separately from the DOM so it survives textarea destruction
let _note = {
  entryId: null,
  savedContent: '',   // last successfully saved value
  pendingContent: null, // non-null means there are unsaved edits
  timer: null,
};

function initNoteEditor(entryId, initialContent) {
  clearTimeout(_note.timer);
  _note = { entryId, savedContent: initialContent, pendingContent: null, timer: null };

  const ta = document.getElementById('reading-note');
  if (!ta) return;

  ta.addEventListener('input', () => {
    _note.pendingContent = ta.value;
    clearTimeout(_note.timer);
    _note.timer = setTimeout(() => _doSaveNote(), 800);
    _updateNoteSaveIndicator('unsaved');
  });

  // Ctrl+Enter = save immediately and blur
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      _note.pendingContent = ta.value;
      clearTimeout(_note.timer);
      _doSaveNote();
      ta.blur();
    }
  });

  // blur = immediate save (covers Tab-away, click-outside, etc.)
  ta.addEventListener('blur', () => {
    if (_note.pendingContent !== null) {
      clearTimeout(_note.timer);
      _doSaveNote();
    }
  });
}

async function flushNote() {
  // Called before destroying the panel – works even if textarea is gone
  if (_note.pendingContent === null || !_note.entryId) return;
  clearTimeout(_note.timer);
  await _doSaveNote();
}

async function _doSaveNote() {
  if (_note.pendingContent === null || !_note.entryId) return;
  const content = _note.pendingContent;
  _note.pendingContent = null; // mark as in-flight before await
  try {
    await api(`/api/entries/${_note.entryId}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ reading_note: content }),
    });
    _note.savedContent = content;
    _updateNoteSaveIndicator('saved');
  } catch (e) {
    _note.pendingContent = content; // restore so retry is possible
    _updateNoteSaveIndicator('error');
  }
}

function _updateNoteSaveIndicator(state) {
  const el = document.getElementById('note-save-status');
  if (!el) return;
  if (state === 'saved')   { el.textContent = '✓ 保存済み'; el.style.color = 'var(--green)'; }
  if (state === 'unsaved') { el.textContent = '…編集中';   el.style.color = 'var(--muted)'; }
  if (state === 'error')   { el.textContent = '⚠ 保存失敗'; el.style.color = 'var(--red)'; }
}

  document.getElementById('add-modal').classList.add('open');

  // Reset BibTeX tab by default

  _clearAddForm();
  setTimeout(() => document.getElementById('add-bibtex-input').focus(), 50);
}

function closeAddModal() {
  document.getElementById('add-modal').classList.remove('open');
}

function switchAddTab(tab) {
  const isBib = tab === 'bib';
  document.getElementById('add-panel-bib').style.display  = isBib ? 'flex' : 'none';
  document.getElementById('add-panel-form').style.display = isBib ? 'none' : 'flex';

function _clearAddForm() {
  ['add-cite-key','add-title','add-author','add-year','add-month',
   'add-journal','add-volume','add-number','add-pages',
   'add-doi','add-eprint','add-url','add-abstract'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  const et = document.getElementById('add-entry-type');
  if (et) et.value = 'article';
}

function _fillAddForm(fields) {
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
  set('add-entry-type', fields.entry_type);
  set('add-cite-key',   fields.cite_key);
  set('add-title',      fields.title);
  set('add-author',     fields.author);
  set('add-year',       fields.year);
  set('add-month',      fields.month);
  set('add-journal',    fields.journal);
  set('add-volume',     fields.volume);
  set('add-number',     fields.number);
  set('add-pages',      fields.pages);
  set('add-doi',        fields.doi);
  set('add-eprint',     fields.eprint);
  set('add-url',        fields.url);
  set('add-abstract',   fields.abstract);
}

async function parseBibtexAndFill() {
  const bib = document.getElementById('add-bibtex-input').value.trim();
  const status = document.getElementById('add-parse-status');
  if (!bib) { status.textContent = 'BibTeXを入力してください'; status.style.color = 'var(--red)'; return; }

  status.textContent = '解析中…'; status.style.color = 'var(--muted)';
  try {
    const fields = await api('/api/parse-bibtex', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ bibtex: bib }),
    });
    _fillAddForm(fields);
    switchAddTab('form');
    status.textContent = '✓ 解析完了';
    status.style.color = 'var(--green)';
  } catch(e) {
    status.textContent = '解析失敗: ' + e.message;
    status.style.color = 'var(--red)';
  }
}

async function submitNewEntry() {
  // Ensure form tab is active (BibTeX tab alone is not enough)
  const formVisible = document.getElementById('add-panel-form').style.display !== 'none';
  if (!formVisible) {
    // Try to auto-parse first if there's BibTeX content
    const bib = document.getElementById('add-bibtex-input').value.trim();
    if (bib) {
      await parseBibtexAndFill();
      // parseBibtexAndFill switches to form tab on success
      const stillBib = document.getElementById('add-panel-form').style.display === 'none';
      if (stillBib) return; // parse failed
    } else {
      switchAddTab('form');
      return;
    }
  }

  const val = id => document.getElementById(id)?.value.trim() ?? '';
  const fields = {
    entry_type: val('add-entry-type') || 'article',
    cite_key:   val('add-cite-key'),
    title:      val('add-title'),
    author:     val('add-author'),
    year:       val('add-year') ? parseInt(val('add-year')) : null,
    month:      val('add-month'),
    journal:    val('add-journal'),
    volume:     val('add-volume'),
    number:     val('add-number'),
    pages:      val('add-pages'),
    doi:        val('add-doi'),
    eprint:     val('add-eprint'),
    url:        val('add-url'),
    abstract:   document.getElementById('add-abstract')?.value.trim() ?? '',
  };

  const errEl = document.getElementById('add-error');
  if (!fields.cite_key) { errEl.textContent = 'cite key は必須です'; return; }

  errEl.textContent = '';
  try {
    const entry = await api('/api/entries', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(fields),
    });
    closeAddModal();
    // Refresh list and open detail
    await loadEntries();
    await loadStats();
    openDetail(entry.id);
    showToast('文献を追加しました', 'ok');
  } catch(e) {
    errEl.textContent = e.message;
  }
}

  loadEntries();
  loadStats();
}

  closeDupesModal();
  openDetail(entryId);
}

async function dupesDelete(entryId, btn) {
  if (!confirm('この文献を削除しますか？\nメモ・タグも含めすべて削除されます。')) return;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    await api(`/api/entries/${entryId}`, { method: 'DELETE' });
    // Remove the dupe-entry row from the modal DOM
    const row = btn.closest('.dupe-entry');
    const group = btn.closest('.dupe-group');
    row.remove();
    // If only 1 entry left in group, collapse the group
    const remaining = group.querySelectorAll('.dupe-entry').length;
    if (remaining < 2) {
      group.innerHTML = `<div style="padding:8px 12px;font-size:12px;color:var(--green);">✓ 解決済み</div>`;
    }
    // Remove from cache
    _cachedEntries = _cachedEntries.filter(e => e.id !== entryId);
    state.total = Math.max(0, state.total - 1);
    renderTable();
    showToast('削除しました', 'ok');
  } catch(e) {
    btn.disabled = false;
    btn.textContent = '🗑';
    showToast('削除に失敗しました', 'err');
  }
}

// Manage tags / keywords modal
// =====================================================================
let _manageTab = 'tags';

function openManageModal(tab = 'tags') {
  _manageTab = tab;
  document.getElementById('manage-modal').classList.add('open');
  switchManageTab(tab);
}

function closeManageModal() {
  document.getElementById('manage-modal').classList.remove('open');
}

function switchManageTab(tab) {
  _manageTab = tab;
  document.getElementById('manage-tab-tags').className = 'add-tab' + (tab === 'tags' ? ' add-tab-active' : '');
  document.getElementById('manage-tab-kws').className  = 'add-tab' + (tab === 'kws'  ? ' add-tab-active' : '');
  document.getElementById('manage-modal-title').textContent = tab === 'tags' ? 'タグ管理' : 'キーワード管理';
  renderManageList();
}

function renderManageList() {
  const list  = document.getElementById('manage-list');
  const items = _manageTab === 'tags' ? state.allTags : state.allKeywords;
  const dotClass = _manageTab === 'tags' ? 'tag-dot' : 'kw-dot';

  if (!items.length) {
    list.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:16px;text-align:center;">
      ${_manageTab === 'tags' ? 'タグがありません' : 'キーワードがありません'}
    </div>`;
    return;
  }

  // Use data-* attributes for item id/name to avoid JS string-escaping bugs
  list.innerHTML = items.map(item => `
    <div class="manage-row" id="manage-row-${item.id}">
      <div class="${dotClass}" style="flex-shrink:0;"></div>
      <span class="manage-name">${esc(item.name)}</span>
      <span class="tag-count">${item.count}</span>
      <button class="btn _mgr-rename" data-id="${item.id}" data-name="${esc(item.name)}"
              style="padding:3px 8px;font-size:11px;">✏ 変更</button>
      <button class="btn btn-danger _mgr-delete" data-id="${item.id}" data-name="${esc(item.name)}"
              style="padding:3px 8px;font-size:11px;">🗑</button>
    </div>
  `).join('');

  // Attach event listeners (safe for any name including commas, quotes, etc.)
  list.querySelectorAll('._mgr-rename').forEach(btn => {
    btn.addEventListener('click', () => startRenameItem(parseInt(btn.dataset.id), btn.dataset.name));
  });
  list.querySelectorAll('._mgr-delete').forEach(btn => {
    btn.addEventListener('click', () => confirmDeleteItem(parseInt(btn.dataset.id), btn.dataset.name));
  });
}

function startRenameItem(id, currentName) {
  const row = document.getElementById(`manage-row-${id}`);
  if (!row) return;
  row.innerHTML = `
    <input class="inline-input _mgr-rename-inp" value="${esc(currentName)}"
           style="flex:1;min-width:0;">
    <button class="btn btn-primary _mgr-save" style="padding:3px 10px;font-size:11px;white-space:nowrap;">保存</button>
    <button class="btn _mgr-cancel"           style="padding:3px 8px;font-size:11px;">✕</button>
  `;
  const inp = row.querySelector('._mgr-rename-inp');
  if (inp) {
    inp.focus(); inp.select();
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter')  submitRenameItem(id, inp);
      if (e.key === 'Escape') renderManageList();
    });
  }
  row.querySelector('._mgr-save').addEventListener('click', () => submitRenameItem(id, inp));
  row.querySelector('._mgr-cancel').addEventListener('click', () => renderManageList());
}

// Show inline confirmation row instead of browser confirm()
function confirmDeleteItem(id, name) {
  const row = document.getElementById(`manage-row-${id}`);
  if (!row) return;
  const dotClass = _manageTab === 'tags' ? 'tag-dot' : 'kw-dot';
  row.innerHTML = `
    <div class="${dotClass}" style="flex-shrink:0;"></div>
    <span style="flex:1;font-size:12px;color:var(--red);">「${esc(name)}」を削除？</span>
    <button class="btn btn-danger _mgr-confirm" style="padding:3px 10px;font-size:11px;white-space:nowrap;">削除する</button>
    <button class="btn _mgr-cancel"             style="padding:3px 8px;font-size:11px;">✕</button>
  `;
  row.querySelector('._mgr-confirm').addEventListener('click', () => deleteManageItem(id, name));
  row.querySelector('._mgr-cancel').addEventListener('click', () => renderManageList());
}

async function submitRenameItem(id, inp) {
  if (!inp) return;
  const newName = inp.value.trim();
  if (!newName) { showToast('名前を入力してください', 'err'); return; }

  // Find old name before the update
  const items   = _manageTab === 'tags' ? state.allTags : state.allKeywords;
  const oldItem = items.find(i => i.id === id);
  const oldName = oldItem ? oldItem.name : null;

  inp.disabled = true;
  try {
    const endpoint = _manageTab === 'tags' ? `/api/tags/${id}` : `/api/keywords/${id}`;
    await api(endpoint, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name: newName }),
    });

    // Patch client state directly — no openDetail() needed
    if (oldName) {
      if (_manageTab === 'tags') {
        // Update sidebar state
        state.allTags = state.allTags.map(t => t.id === id ? {...t, name: newName} : t);
        renderTags();
        // Update open detail chips
        if (_tagState.entryId) {
          const i = _tagState.names.indexOf(oldName);
          if (i !== -1) { _tagState.names[i] = newName; renderTagChips(); }
        }
        // Update cached entries
        _cachedEntries.forEach(e => {
          (e.tags || []).forEach(t => { if (t.name === oldName) t.name = newName; });
        });
      } else {
        state.allKeywords = state.allKeywords.map(k => k.id === id ? {...k, name: newName} : k);
        renderKeywords();
        if (_kwState.entryId) {
          const i = _kwState.kws.indexOf(oldName);
          if (i !== -1) { _kwState.kws[i] = newName; renderKwChips(); }
        }
        _cachedEntries.forEach(e => {
          if (e.keywords) {
            const i = e.keywords.indexOf(oldName);
            if (i !== -1) e.keywords[i] = newName;
          }
        });
      }
      renderManageList();
      renderTable();
    }
    showToast('名前を変更しました', 'ok');
  } catch(err) {
    inp.disabled = false;
    showToast('変更に失敗しました: ' + err.message, 'err');
  }
}

async function deleteManageItem(id, name) {
  // Disable the confirm button to prevent double-submission
  const row = document.getElementById(`manage-row-${id}`);
  const confirmBtn = row?.querySelector('._mgr-confirm');
  if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.textContent = '…'; }

  try {
    const endpoint = _manageTab === 'tags' ? `/api/tags/${id}` : `/api/keywords/${id}`;
    await api(endpoint, { method: 'DELETE' });

    // Patch client state directly — no openDetail() needed
    if (_manageTab === 'tags') {
      state.allTags = state.allTags.filter(t => t.id !== id);
      renderTags();
      if (_tagState.entryId) {
        const i = _tagState.names.indexOf(name);
        if (i !== -1) { _tagState.names.splice(i, 1); renderTagChips(); }
      }
      _cachedEntries.forEach(e => { if (e.tags) e.tags = e.tags.filter(t => t.name !== name); });
    } else {
      state.allKeywords = state.allKeywords.filter(k => k.id !== id);
      renderKeywords();
      if (_kwState.entryId) {
        const i = _kwState.kws.indexOf(name);
        if (i !== -1) { _kwState.kws.splice(i, 1); renderKwChips(); }
      }
      _cachedEntries.forEach(e => { if (e.keywords) e.keywords = e.keywords.filter(k => k !== name); });
    }
    renderManageList();
    renderTable();
    const type = _manageTab === 'tags' ? 'タグ' : 'キーワード';
    showToast(`${type}を削除しました`, 'ok');
  } catch(err) {
    if (confirmBtn) { confirmBtn.disabled = false; confirmBtn.textContent = '削除する'; }
    showToast('削除に失敗しました', 'err');
  }
}

// =====================================================================
// Utils
// =====================================================================
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function esc2(s) {
  if (s == null) return '';
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
}
</script>
